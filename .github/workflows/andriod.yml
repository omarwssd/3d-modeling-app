
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show repository files
        run: |
          echo "Repository folders:"
          ls -la
          echo "Searching for Gradle settings:"
          find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Could not find settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Android project found in: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
